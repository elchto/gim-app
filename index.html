<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Intelligence Monitor</title>
<meta name="description" content="Ringkasan berita dunia, konflik, politik, ekonomi, profil negara dan linimasa sejarah.">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intel Monitor">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" width="32" height="32">
    <div>
      <h1>Global Intelligence Monitor</h1>
      <p class="updated" id="updated">Memuat data…</p>
    </div>
    <button id="refresh" class="iconbtn" aria-label="Muat ulang data" title="Muat ulang data">⟳</button>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Cari semua: Iran, pemilu, inflasi, Malaysia…" autocomplete="off" enterkeyhint="search">
  </div>
</header>
<main id="main" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Bagian">
  <button data-tab="news" class="active"><span>📰</span>Berita</button>
  <button data-tab="conflicts"><span>⚔️</span>Konflik</button>
  <button data-tab="politics"><span>🏛️</span>Politik</button>
  <button data-tab="economy"><span>📈</span>Ekonomi</button>
  <button data-tab="countries"><span>🌍</span>Negara</button>
  <button data-tab="timeline"><span>🕰️</span>Sejarah</button>
</nav>
<script src="app.js" defer></script>
</body>
</html>
